[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-algorithms-ai"
version = "0.1.0"
description = "Evolutionary Algorithms for AI Hyperparameter Optimization"
authors = [
    {name = "kryptologyst", email = "kryptologyst@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0",
    "tensorboard>=2.13.0",
    "optuna>=3.3.0",
    "ray[tune]>=2.6.0",
    "numpyro>=0.13.0",
    "pyro-ppl>=1.8.0",
    "avalanche-lib>=0.4.0",
    "hyperopt>=0.2.7",
    "scikit-optimize>=0.9.0",
    "bayesian-optimization>=1.4.0",
    "streamlit>=1.25.0",
    "gradio>=3.40.0",
    "deap>=1.4.0",
    "pymoo>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pre-commit>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/kryptologyst/evolutionary-algorithms-ai"
Repository = "https://github.com/kryptologyst/evolutionary-algorithms-ai"
Issues = "https://github.com/kryptologyst/evolutionary-algorithms-ai/issues"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
